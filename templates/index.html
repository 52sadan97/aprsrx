<!DOCTYPE html>
<html lang="tr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APRSRX - Canlı Radar & Mesajlaşma</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html {
            height: 100%;
            margin: 0;
            background-color: #121212;
            color: #e0e0e0;
            overflow: hidden;
        }
        .navbar {
            background: linear-gradient(90deg, #1e1e1e 0%, #2d2d2d 100%);
            border-bottom: 1px solid #333;
            z-index: 1000;
        }
        .navbar-brand {
            color: #0dcaf0 !important;
            font-weight: bold;
            letter-spacing: 1px;
        }
        #map {
            height: calc(100vh - 56px); /* Navbar height subtracted */
            width: 100%;
            z-index: 1;
        }
        #sidebar {
            height: calc(100vh - 56px);
            background-color: #1e1e1e;
            border-left: 1px solid #333;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            background-color: #252526;
            padding: 15px;
            border-bottom: 1px solid #333;
            font-weight: bold;
        }
        .chat-messages {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message-box {
            background-color: #2d2d2d;
            border-radius: 8px;
            padding: 10px;
            font-size: 0.9rem;
            position: relative;
        }
        .message-box.self {
            background-color: #0d6efd;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }
        .message-box.other {
            background-color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 0;
            border-left: 3px solid #0dcaf0;
        }
        .message-header {
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }
        .message-box.self .message-header {
            color: #ddd;
        }
        .chat-input-area {
            padding: 15px;
            background-color: #252526;
            border-top: 1px solid #333;
        }
        .form-control {
            background-color: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
        }
        .form-control:focus {
            background-color: #333;
            border-color: #0dcaf0;
            color: #fff;
            box-shadow: none;
        }
        .btn-info {
            background-color: #0dcaf0;
            border-color: #0dcaf0;
            color: #000;
        }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background-color: #1e1e1e;
            color: #e0e0e0;
        }
        .btn-chat-target {
            cursor: pointer;
            color: #0dcaf0;
            text-decoration: underline;
        }
        @keyframes blink {
            from { opacity: 0.7; transform: scale(1); }
            to { opacity: 1; transform: scale(1.1); }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#"><i class="fa-solid fa-radar"></i> APRSRX Canlı Harita</a>
        <div class="d-flex align-items-center">
            <input type="date" id="historyDate" class="form-control form-control-sm bg-dark text-white border-secondary me-3" style="width: auto;">
            <span class="text-muted"><i class="fa-solid fa-circle text-success ms-3 me-1 blink"></i> Canlı Dinleniyor...</span>
        </div>
    </div>
</nav>

<div class="container-fluid p-0">
    <div class="row g-0">
        <!-- Harita Alanı -->
        <div class="col-md-8 col-lg-9">
            <div id="map"></div>
        </div>
        
        <!-- Mesajlaşma Yan Paneli -->
        <div class="col-md-4 col-lg-3" id="sidebar">
            <div class="chat-header d-flex justify-content-between align-items-center">
                <span><i class="fa-solid fa-comments text-info"></i> Telsiz Mesajları</span>
                <div>
                    <span class="badge bg-secondary me-1" id="target-badge">Genel İzleme</span>
                    <button class="btn btn-sm btn-outline-info" data-bs-toggle="modal" data-bs-target="#settingsModal" title="Ayarlar" onclick="loadSettings()">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                </div>
            </div>
            
            <div class="chat-messages" id="chat-messages">
                <div class="text-center text-muted mt-3 small">
                    <i class="fa-solid fa-satellite-dish mb-2" style="font-size: 24px;"></i><br>
                    APRS-IS Ağı Dinleniyor...<br>Henüz mesaj yok.
                </div>
            </div>
            
            <div class="chat-input-area">
                <form id="message-form" class="d-flex flex-column gap-2">
                    <input type="text" id="target-input" class="form-control form-control-sm" placeholder="Hedef Çağrı İşareti (Örn: TA7KES-1)">
                    <div class="input-group">
                        <input type="text" id="message-input" class="form-control" placeholder="Mesajınızı yazın..." required>
                        <button class="btn btn-info" type="submit"><i class="fa-solid fa-paper-plane"></i></button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Ayarlar Modal -->
<div class="modal fade" id="settingsModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content text-dark bg-dark text-light border-secondary">
      <div class="modal-header border-secondary">
        <h5 class="modal-title"><i class="fa-solid fa-satellite-dish"></i> APRS Takip Ayarları</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label for="trackedCallsigns" class="form-label">Takip Edilecek Çağrı İşaretleri</label>
          <input type="text" class="form-control bg-secondary text-light border-dark" id="trackedCallsigns" placeholder="TA7KES, TA7BSS, YM7KSE">
          <div class="form-text text-light opacity-75">Çağrı işaretlerini virgülle ayırarak giriniz. Sistem bu istasyonlardan gelen konum ve mesajları dinleyecektir.</div>
        </div>
      </div>
      <div class="modal-footer border-secondary">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
        <button type="button" class="btn btn-info" onclick="saveSettings()">Kaydet ve Yeniden Başlat</button>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Socket.IO -->
<script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // Haritayı Başlat (Varsayılan Merkez: Ordu/Korgan civarı)
    const map = L.map('map', {
        zoomControl: false // Sağ alta alacağız
    }).setView([40.8, 37.3], 9);

    // Zoom kontrolünü sağ alta al
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Google Haritalar (Uydu + İsimler - Hybrid Katmanı)
    L.tileLayer('http://mt0.google.com/vt/lyrs=y&hl=tr&x={x}&y={y}&z={z}', {
        attribution: '&copy; Google Maps',
        maxZoom: 20
    }).addTo(map);

    // Cihazları ve yollarını (izlerini) tutacağımız objeler
    const markers = {};
    const tracks = {};
    
    // Mesajlar için Socket.IO Bağlantısı
    const socket = io();
    const chatContainer = document.getElementById('chat-messages');
    
    function setTarget(callsign) {
        document.getElementById('target-input').value = callsign;
        document.getElementById('target-badge').innerText = callsign;
        document.getElementById('message-input').focus();
    }
    
    function appendMessage(sender, receiver, text, isSelf, customTime = null) {
        // Remove initial placeholder if exists
        const placeholder = chatContainer.querySelector('.text-center');
        if (placeholder) placeholder.remove();
        
        let time = customTime;
        if (!time) {
            time = new Date().toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'});
        }
        const msgDiv = document.createElement('div');
        msgDiv.className = `message-box ${isSelf ? 'self' : 'other'}`;
        
        msgDiv.innerHTML = `
            <div class="message-header">
                <strong class="${!isSelf ? 'btn-chat-target' : ''}" onclick="${!isSelf ? `setTarget('${sender}')` : ''}">${sender}</strong>
                <span>${time}</span>
            </div>
            <div>${text}</div>
            ${!isSelf && receiver ? `<div style="font-size: 0.7rem; color: #888; text-align: right; margin-top: 4px;">Hedef: ${receiver}</div>` : ''}
        `;
        
        chatContainer.appendChild(msgDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    socket.on('connect', () => {
        console.log("Sunucuya bağlanıldı!");
    });

    // APRS Simgesini FontAwesome İkonuna Çevirme
    function getAprsIcon(symbolTable, symbol) {
        let faClass = "fa-broadcast-tower"; // Varsayılan
        if (symbolTable === '/' || symbolTable === '\\') {
            switch(symbol) {
                case '>': faClass = "fa-car"; break;
                case 'v': faClass = "fa-van-shuttle"; break;
                case 'k': faClass = "fa-truck"; break;
                case 'j': faClass = "fa-truck-pickup"; break;
                case '<': faClass = "fa-motorcycle"; break;
                case '[': faClass = "fa-person-running"; break;
                case 'Y': faClass = "fa-ship"; break;
                case '-': faClass = "fa-house"; break;
                case '=': faClass = "fa-train"; break;
                case 'O': faClass = "fa-parachute-box"; break;
                case 'X': faClass = "fa-helicopter"; break;
                case '&': faClass = "fa-tower-broadcast"; break;
                case 'I': faClass = "fa-network-wired"; break;
                case 'b': faClass = "fa-bicycle"; break;
                case 'a': faClass = "fa-truck-medical"; break;
                case 's': faClass = "fa-ship"; break;
                case '_': faClass = "fa-cloud"; break;
            }
        }
        return `<i class="fa-solid ${faClass}"></i>`;
    }

    // Tarih Seçici Değişimi
    document.getElementById('historyDate').addEventListener('change', function(e) {
        loadHistory(e.target.value);
    });
    
    // Geçmiş Verileri Yükle
    function loadHistory(dateStr) {
        let url = '/api/history?t=' + new Date().getTime();
        if (dateStr) url += '&date=' + dateStr;
        
        // Önce haritayı temizle
        for (let key in markers) {
            map.removeLayer(markers[key]);
        }
        for (let key in tracks) {
            map.removeLayer(tracks[key]);
        }
        // Objelere sıfırdan başla (referansları sıfırlamıyoruz ki const hata vermesin, içini boşaltıyoruz ama dict olarak tanımlı const ise hata vermez)
        Object.keys(markers).forEach(k => delete markers[k]);
        Object.keys(tracks).forEach(k => delete tracks[k]);
        chatContainer.innerHTML = '';
        
        fetch(url)
            .then(response => response.json())
            .then(data => {
            if (data.status === 'success') {
                // Lokasyon Geçmişi
                data.locations.forEach(loc => {
                    const latlng = [loc.lat, loc.lon];
                    const callsign = loc.callsign;
                    
                    if (!markers[callsign]) {
                        let bgColor = '#0dcaf0';
                        let textColor = '#000';
                        let pulseEffect = '';
                        
                        let isTracked = false;
                        if (callsign.startsWith('{{ config.aprs.callsign }}')) isTracked = true;
                        {% for t in config.get('tracked_callsigns', []) %}
                        if (callsign.startsWith('{{ t }}')) isTracked = true;
                        {% endfor %}
                        
                        if (isTracked) {
                            bgColor = '#ffd700';
                            textColor = '#000';
                            pulseEffect = `box-shadow: 0 0 15px ${bgColor}, 0 0 5px ${bgColor} inset; animation: blink 1.5s infinite alternate;`;
                        }
                        
                        let displayContent = loc.symbol ? getAprsIcon(loc.symbol_table, loc.symbol) : callsign.substring(0,2);
                        
                        const iconHTML = `<div style="background:${bgColor};color:${textColor};border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:12px;border:2px solid #fff; ${pulseEffect}">${displayContent}</div>`;
                        const customIcon = L.divIcon({
                            html: iconHTML,
                            className: '',
                            iconSize: [28, 28],
                            iconAnchor: [14, 14]
                        });
                        
                        markers[callsign] = L.marker(latlng, {icon: customIcon}).addTo(map);
                        tracks[callsign] = L.polyline([latlng], {color: bgColor, weight: 2, opacity: 0.8}).addTo(map);
                    } else {
                        markers[callsign].setLatLng(latlng);
                        tracks[callsign].addLatLng(latlng);
                    }
                    
                    let popupText = `<strong>${callsign}</strong><br>`;
                    if (loc.comment) popupText += `<small class="text-muted">${loc.comment}</small><br>`;
                    popupText += `<small class="text-muted">Son Görülme: ${new Date(loc.timestamp * 1000).toLocaleString('tr-TR')}</small><br>`;
                    popupText += `<button class="btn btn-sm btn-info mt-2 w-100" onclick="setTarget('${callsign}')"><i class="fa-solid fa-comment"></i> Mesaj Yaz</button>`;
                    markers[callsign].bindPopup(popupText);
                });
                
                // Mesaj Geçmişi
                data.messages.forEach(msg => {
                    const customTime = new Date(msg.timestamp * 1000).toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'});
                    const isSelf = msg.sender.startsWith('{{ config.aprs.callsign }}');
                    appendMessage(msg.sender, msg.receiver, msg.message_text, isSelf, customTime);
                });
            }
        });
    }
    
    // Sayfa yüklenince bugünün tarihini atayıp yükle
    document.getElementById('historyDate').valueAsDate = new Date();
    loadHistory(document.getElementById('historyDate').value);

    socket.on('aprs_packet', (packet) => {
        // Konsolda görmek isterseniz açabilirsiniz
        // console.log(packet);
        
        const callsign = packet.from;
        
        // --- 1. HARİTA (KONUM) İŞLEMLERİ ---
        if (packet.latitude && packet.longitude) {
            const latlng = [packet.latitude, packet.longitude];
            
            // Marker Yoksa Oluştur
            if (!markers[callsign]) {
                let bgColor = '#0dcaf0';
                let textColor = '#000';
                let pulseEffect = '';
                
                let isTracked = false;
                if (callsign.startsWith('{{ config.aprs.callsign }}')) isTracked = true;
                {% for t in config.get('tracked_callsigns', []) %}
                if (callsign.startsWith('{{ t }}')) isTracked = true;
                {% endfor %}
                
                // Özel Takip Vurgulaması
                if (isTracked) {
                    bgColor = '#ffd700'; // Altın sarısı
                    textColor = '#000';
                    pulseEffect = `box-shadow: 0 0 15px ${bgColor}, 0 0 5px ${bgColor} inset; animation: blink 1.5s infinite alternate;`;
                }
                
                let displayContent = packet.symbol ? getAprsIcon(packet.symbol_table, packet.symbol) : callsign.substring(0,2);
                
                const iconHTML = `<div style="background:${bgColor};color:${textColor};border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:12px;border:2px solid #fff; ${pulseEffect}">${displayContent}</div>`;
                const customIcon = L.divIcon({
                    html: iconHTML,
                    className: '',
                    iconSize: [28, 28],
                    iconAnchor: [14, 14]
                });
                
                markers[callsign] = L.marker(latlng, {icon: customIcon}).addTo(map);
                
                // Track (İz) için polyline başlat
                tracks[callsign] = L.polyline([latlng], {color: bgColor, weight: 2, opacity: 0.8}).addTo(map);
            } else {
                // Marker varsa konumunu güncelle
                markers[callsign].setLatLng(latlng);
                // İze noktayı ekle
                tracks[callsign].addLatLng(latlng);
            }
            
            // Popup İçeriği
            let popupText = `<strong>${callsign}</strong><br>`;
            if(packet.comment) popupText += `<small class="text-muted">${packet.comment}</small><br>`;
            popupText += `<button class="btn btn-sm btn-info mt-2 w-100" onclick="setTarget('${callsign}')"><i class="fa-solid fa-comment"></i> Mesaj Yaz</button>`;
            
            markers[callsign].bindPopup(popupText);
        }
        
        // --- 2. MESAJLAŞMA İŞLEMLERİ ---
        // APRS paket formatı { format: "message", message_text: "...", addresse: "..." }
        if (packet.format === 'message') {
            const receiver = (packet.addresse || "").trim();
            let text = (packet.message_text || "").trim();
            
            if (!text && packet.response) {
                if (packet.response === 'ack') {
                    text = `✅ [İletildi - ACK] Mesaj No: ${packet.msgNo || ''}`;
                } else if (packet.response === 'rej') {
                    text = `❌ [Reddedildi - REJ] Mesaj No: ${packet.msgNo || ''}`;
                } else {
                    text = `[Sistem: ${packet.response}]`;
                }
            }
            
            appendMessage(callsign, receiver, text, false);
        }
    });

    // Mesaj Gönderme Formu
    document.getElementById('message-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const target = document.getElementById('target-input').value.trim();
        const msgInput = document.getElementById('message-input');
        const text = msgInput.value.trim();
        
        if(!target) {
            alert("Lütfen hedefin çağrı işaretini girin!");
            return;
        }
        
        if(!text) return;

        // Ekrana kendi mesajımızı ekle
        appendMessage("Ben", target, text, true);
        
        // Sunucuya gönder
        socket.emit('send_message', {
            target: target,
            message: text
        }, (response) => {
            if(response && response.status === 'error') {
                alert("Mesaj Gönderilemedi: " + response.message);
            }
        });
        
        msgInput.value = '';
    });
    
    // Ayarlar Yükleme ve Kaydetme İşlemleri
    function loadSettings() {
        fetch('/api/settings')
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    document.getElementById('trackedCallsigns').value = data.tracked_callsigns.join(', ');
                }
            })
            .catch(err => console.error("Ayarlar yüklenemedi:", err));
    }

    function saveSettings() {
        const input = document.getElementById('trackedCallsigns').value;
        const callsigns = input.split(',').map(c => c.trim()).filter(c => c);
        
        fetch('/api/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tracked_callsigns: callsigns })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                alert(data.message);
                const modal = bootstrap.Modal.getInstance(document.getElementById('settingsModal'));
                if (modal) modal.hide();
                setTimeout(() => {
                    window.location.reload();
                }, 1500); // Yeniden başlama süresi tanıyıp sayfayı yenile
            } else {
                alert("Hata: " + data.message);
            }
        })
        .catch(err => alert("Ayarlar kaydedilemedi!"));
    }
</script>
</body>
</html>
